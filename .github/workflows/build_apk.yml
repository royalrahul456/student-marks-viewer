name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Locate project directory & Build APK
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "Found in root"
            flutter pub get
            flutter build apk --release
            echo "APK_PATH=build/app/outputs/flutter-apk/app-release.apk" >> $GITHUB_ENV
          elif [ -f "student_marks_viewer/pubspec.yaml" ]; then
            echo "Found in student_marks_viewer/"
            cd student_marks_viewer
            flutter pub get
            flutter build apk --release
            echo "APK_PATH=student_marks_viewer/build/app/outputs/flutter-apk/app-release.apk" >> $GITHUB_ENV
          else
            DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1 | xargs dirname)
            echo "Found in $DIR"
            cd "$DIR"
            flutter pub get
            flutter build apk --release
            echo "APK_PATH=$DIR/build/app/outputs/flutter-apk/app-release.apk" >> $GITHUB_ENV
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-marks-viewer-release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
